[package]
name = "kodmoz-code"
version = "0.1.0"
edition = "2021"
description = "Kodmoz Code — a minimal VS Code-like IDE written in Rust"
license = "MIT"
repository = "https://github.com/hasanislamoglu5361/kodmoz-code"

[dependencies]
eframe = "0.31"
egui = "0.31"
egui_commonmark = { version = "0.20", default-features = false, features = ["pulldown_cmark"] }
htmd = "0.5"
ignore = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico", "tiff"] }
portable-pty = "0.9.0"
rfd = "0.15"
serde_json = "1"
streaming-iterator = "0.1"
syntect = "5.3.0"
tree-sitter = "0.24"
tree-sitter-rust = "0.23"
two-face = "0.5.2"
url = "2"
vt100 = "0.18.1"

[build-dependencies]
cc = "1.10.0"
